<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Cloud Corner — Sign in ☁️</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-mascot">
        <img src="assets/cinnamoroll-sit.png" alt="" class="mascot-img"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'mascot-cloud big',textContent:'☁️'}))" />
      </div>
      <h1 class="login-title">The Cloud Corner</h1>

      <!-- Tab toggle -->
      <div class="tab-toggle">
        <button id="tab-signin" class="tab active" type="button">Sign in</button>
        <button id="tab-signup" class="tab" type="button">Sign up</button>
      </div>

      <form id="auth-form" class="auth-form" autocomplete="on">
        <label id="name-field" class="field" hidden>
          <span>Your name</span>
          <input id="display-name" type="text" autocomplete="name" />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" required minlength="6" placeholder="••••••" autocomplete="current-password" />
        </label>

        <p id="auth-error" class="auth-error" hidden></p>

        <button id="submit-btn" type="submit" class="primary-btn">Sign in</button>
      </form>

      <div class="divider-or"><span>or</span></div>

      <button id="google-btn" type="button" class="google-btn">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </div>
    <p class="login-foot">☁️ made with love</p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
